name: Publish Cashier to npm
run-name: "Publish cashier: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"

on:
  push:
    tags:
      - 'cashier-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Recovery only. Existing cashier-v* tag to publish again."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cashier-${{ github.ref_type }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          if [[ "${RELEASE_TAG}" != cashier-v* ]]; then
            echo "release_tag must start with cashier-v. Received: ${RELEASE_TAG}" >&2
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout code at release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release-tag.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${{ steps.release-tag.outputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#cashier-v}"
          PACKAGE_VERSION=$(jq -r .version package.json)

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

      - name: Ensure version is not already published
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(jq -r .name package.json)
          PACKAGE_VERSION=$(jq -r .version package.json)

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm." >&2
            exit 1
          fi

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish package to npm
        run: npm publish --access public --provenance
